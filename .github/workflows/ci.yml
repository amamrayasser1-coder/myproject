name: CI
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses and install API 35
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.4"
      - name: Core and network unit tests
        run: gradle :engine-core:test :engine-network:test
      - name: JVM module builds
        run: gradle :engine-core:build :engine-network:build
      - name: Android adapter compilation
        run: gradle :engine-media3:assembleDebug
